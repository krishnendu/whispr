<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F7F3EC"/>

  <!-- top -->
  <text x="32" y="58" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="28" fill="#161513">whispr</text>
  <circle cx="73" cy="54" r="3.5" fill="#FF4F1F"/>
  <circle cx="346" cy="52" r="20" fill="none" stroke="#161513" stroke-width="1.2"/>
  <text x="346" y="58" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" fill="#161513">M</text>

  <!-- greeting -->
  <text x="32" y="148" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="36" fill="#161513">evening,</text>
  <text x="32" y="190" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="36" fill="#161513">@moonlit_fox.</text>
  <text x="32" y="222" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#807972">412 people are in your vibes right now.</text>

  <!-- big CTA card -->
  <rect x="32" y="252" width="326" height="180" rx="20" fill="#161513"/>
  <text x="52" y="294" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="28" fill="#F7F3EC">find someone</text>
  <text x="52" y="324" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="28" fill="#F7F3EC">to talk to.</text>
  <text x="52" y="358" font-family="'Geist', system-ui, sans-serif" font-size="13" fill="#A8A29E">match by vibe. end anytime.</text>
  <rect x="52" y="376" width="132" height="40" rx="20" fill="#FF4F1F"/>
  <text x="118" y="402" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">start →</text>

  <!-- your vibes -->
  <text x="32" y="476" font-family="'Geist', system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#807972">YOUR VIBES</text>
  <g font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="500">
    <g transform="translate(32,490)">
      <rect width="64" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="32" y="20" text-anchor="middle" fill="#161513">chill</text>
    </g>
    <g transform="translate(104,490)">
      <rect width="84" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="42" y="20" text-anchor="middle" fill="#161513">latenite</text>
    </g>
    <g transform="translate(196,490)">
      <rect width="64" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="32" y="20" text-anchor="middle" fill="#161513">flirty</text>
    </g>
    <g transform="translate(268,490)">
      <rect width="52" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="26" y="20" text-anchor="middle" fill="#807972">edit</text>
    </g>
  </g>

  <!-- saved -->
  <line x1="32" y1="572" x2="358" y2="572" stroke="#E6DFD2"/>
  <text x="32" y="606" font-family="'Geist', system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#807972">SAVED WHISPERS</text>

  <g font-family="'Geist', system-ui, sans-serif">
    <g transform="translate(32,640)">
      <text font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="20" fill="#161513">aria_</text>
      <text y="22" font-size="13" fill="#807972">"that sounded so real, lol"</text>
      <text x="326" y="-2" text-anchor="end" font-size="11" fill="#807972">2d</text>
    </g>
    <line x1="32" y1="694" x2="358" y2="694" stroke="#E6DFD2"/>
    <g transform="translate(32,722)">
      <text font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="20" fill="#161513">drift_</text>
      <text y="22" font-size="13" fill="#807972">"see you in the void"</text>
      <text x="326" y="-2" text-anchor="end" font-size="11" fill="#807972">5d</text>
    </g>
  </g>

  <!-- bottom nav -->
  <line x1="0" y1="772" x2="390" y2="772" stroke="#E6DFD2"/>
  <g font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="500">
    <text x="60" y="806" text-anchor="middle" fill="#161513">home</text>
