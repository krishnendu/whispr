<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="me" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- header -->
  <rect x="0" y="0" width="390" height="92" fill="#0a0719"/>
  <text x="24" y="40" fill="#a78bfa" font-family="Inter" font-size="22">←</text>
  <circle cx="78" cy="56" r="20" fill="url(#accent)"/>
  <text x="78" y="62" text-anchor="middle" fill="#fff" font-family="Inter" font-size="14" font-weight="700">A</text>
  <text x="108" y="50" fill="#fff" font-family="Inter" font-size="15" font-weight="700">aria_</text>
  <text x="108" y="68" fill="#22d3ee" font-family="Inter" font-size="11">● online · #latenite #flirty</text>
  <text x="338" y="60" fill="#9ca3af" font-family="Inter" font-size="20">⋯</text>

  <!-- date pill -->
  <rect x="155" y="106" width="80" height="22" rx="11" fill="#1a1740"/>
  <text x="195" y="121" text-anchor="middle" fill="#9ca3af" font-family="Inter" font-size="11">Today, 1:42 AM</text>

  <!-- them bubble 1 -->
  <rect x="24" y="148" width="240" height="44" rx="18" fill="#1a1740"/>
  <text x="40" y="174" fill="#fff" font-family="Inter" font-size="14">hey what're you doing up</text>

  <!-- them bubble 2 -->
  <rect x="24" y="200" width="180" height="44" rx="18" fill="#1a1740"/>
  <text x="40" y="226" fill="#fff" font-family="Inter" font-size="14">can't sleep either?</text>

  <!-- me bubble -->
  <rect x="166" y="256" width="200" height="44" rx="18" fill="url(#me)"/>
  <text x="350" y="282" text-anchor="end" fill="#fff" font-family="Inter" font-size="14">yeah brain won't shut up</text>

  <!-- them bubble 3 (longer) -->
  <rect x="24" y="312" width="290" height="68" rx="18" fill="#1a1740"/>
  <text x="40" y="338" fill="#fff" font-family="Inter" font-size="14">same. tell me something stupid</text>
  <text x="40" y="358" fill="#fff" font-family="Inter" font-size="14">that's been on your mind</text>

  <!-- me bubble 2 -->
  <rect x="146" y="388" width="220" height="68" rx="18" fill="url(#me)"/>
  <text x="350" y="414" text-anchor="end" fill="#fff" font-family="Inter" font-size="14">do you ever feel like</text>
  <text x="350" y="434" text-anchor="end" fill="#fff" font-family="Inter" font-size="14">strangers know us better</text>

  <!-- them typing -->
  <rect x="24" y="468" width="74" height="40" rx="20" fill="#1a1740"/>
  <circle cx="44" cy="488" r="4" fill="#a78bfa"/>
  <circle cx="60" cy="488" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle cx="76" cy="488" r="4" fill="#a78bfa" opacity="0.3"/>

  <!-- ephemeral notice -->
  <rect x="24" y="528" width="342" height="36" rx="10" fill="rgba(167,139,250,0.08)" stroke="#312e81" stroke-dasharray="3 3"/>
  <text x="195" y="551" text-anchor="middle" fill="#a78bfa" font-family="Inter" font-size="11">🌒 messages older than 7 days disappear forever</text>

  <!-- input bar -->
  <rect x="0" y="752" width="390" height="92" fill="#0a0719"/>
  <rect x="24" y="772" width="260" height="48" rx="24" fill="#1a1740" stroke="#312e81"/>
  <text x="48" y="802" fill="#6b7280" font-family="Inter" font-size="14">whisper something...</text>
  <circle cx="312" cy="796" r="22" fill="#1a1740"/>
  <text x="312" y="804" text-anchor="middle" fill="#a78bfa" font-family="Inter" font-size="16">🎁</text>
  <circle cx="356" cy="796" r="22" fill="url(#accent)"/>
  <text x="356" y="803" text-anchor="middle" fill="#fff" font-family="Inter" font-size="16">↑</text>
</svg>
