  <!-- trending tags -->
  <text x="24" y="448" fill="#fff" font-family="Inter" font-size="16" font-weight="700">Trending tonight</text>
  <g font-family="Inter" font-size="12">
    <g transform="translate(24,468)">
      <rect width="120" height="44" rx="14" fill="#0f0c2e" stroke="#312e81"/>
      <text x="60" y="22" text-anchor="middle" fill="#fff" font-weight="700">#3am-thoughts</text>
