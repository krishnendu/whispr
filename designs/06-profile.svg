<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F7F3EC"/>

  <text x="32" y="60" font-family="'Geist', system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#807972">YOU</text>
  <text x="32" y="116" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="46" fill="#161513">@moonlit_fox</text>

  <g transform="translate(32,140)">
    <rect width="116" height="26" rx="13" fill="none" stroke="#2C5F4F" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="3.5" fill="#2C5F4F"/>
    <text x="26" y="18" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C5F4F">verified human</text>
  </g>

  <!-- stats row -->
  <g font-family="'Geist', system-ui, sans-serif">
    <g transform="translate(32,200)">
      <text font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="38" fill="#161513">128</text>
      <text y="22" font-size="11" letter-spacing="1.5" fill="#807972">WHISPERS</text>
    </g>
    <line x1="138" y1="208" x2="138" y2="244" stroke="#E6DFD2"/>
    <g transform="translate(160,200)">
      <text font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="38" fill="#161513">7</text>
      <text y="22" font-size="11" letter-spacing="1.5" fill="#807972">VAULTED</text>
    </g>
    <line x1="252" y1="208" x2="252" y2="244" stroke="#E6DFD2"/>
    <g transform="translate(274,200)">
      <text font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="38" fill="#161513">4.8</text>
      <text y="22" font-size="11" letter-spacing="1.5" fill="#807972">TRUST</text>
    </g>
  </g>

  <line x1="32" y1="288" x2="358" y2="288" stroke="#E6DFD2"/>

  <!-- list rows -->
  <g font-family="'Geist', system-ui, sans-serif" font-size="15">
    <g transform="translate(32,320)">
      <text fill="#161513">My vibes</text>
      <text x="326" text-anchor="end" fill="#807972">5</text>
    </g>
    <line x1="32" y1="346" x2="358" y2="346" stroke="#E6DFD2"/>

    <g transform="translate(32,380)">
      <text fill="#161513">Blocked accounts</text>
      <text x="326" text-anchor="end" fill="#807972">3</text>
    </g>
    <line x1="32" y1="406" x2="358" y2="406" stroke="#E6DFD2"/>

    <g transform="translate(32,440)">
      <text fill="#161513">Age verification</text>
      <text x="326" text-anchor="end" fill="#2C5F4F" font-weight="500">verified</text>
    </g>
    <line x1="32" y1="466" x2="358" y2="466" stroke="#E6DFD2"/>

    <g transform="translate(32,500)">
      <text fill="#161513">Spice mode</text>
      <g transform="translate(282,-14)">
        <rect width="44" height="24" rx="12" fill="#FF4F1F"/>
        <circle cx="32" cy="12" r="9" fill="#FFFFFF"/>
      </g>
    </g>
    <line x1="32" y1="526" x2="358" y2="526" stroke="#E6DFD2"/>

    <g transform="translate(32,560)">
      <text fill="#161513">Auto-delete after</text>
      <text x="326" text-anchor="end" fill="#807972">7 days</text>
    </g>
    <line x1="32" y1="586" x2="358" y2="586" stroke="#E6DFD2"/>

    <g transform="translate(32,620)">
      <text fill="#161513">Notifications</text>
      <text x="326" text-anchor="end" fill="#807972">on</text>
    </g>
    <line x1="32" y1="646" x2="358" y2="646" stroke="#E6DFD2"/>
  </g>

  <!-- danger -->
  <text x="195" y="730" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="500" fill="#FF4F1F">delete account &amp; everything</text>
  <line x1="100" y1="738" x2="290" y2="738" stroke="#FF4F1F" stroke-width="1"/>

  <!-- bottom nav -->
  <line x1="0" y1="772" x2="390" y2="772" stroke="#E6DFD2"/>
  <g font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="500">
    <text x="60" y="806" text-anchor="middle" fill="#807972">home</text>
    <text x="148" y="806" text-anchor="middle" fill="#807972">discover</text>
    <text x="240" y="806" text-anchor="middle" fill="#807972">chats</text>
    <text x="332" y="806" text-anchor="middle" fill="#161513">me</text>
    <line x1="312" y1="816" x2="352" y2="816" stroke="#FF4F1F" stroke-width="2"/>
  </g>
</svg>
