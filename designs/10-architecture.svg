<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880">
  <rect width="1400" height="880" fill="#F7F3EC"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#161513"/>
    </marker>
    <marker id="arrCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF4F1F"/>
    </marker>
  </defs>

  <text x="72" y="92" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="48" fill="#161513">architecture</text>
  <text x="72" y="124" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#807972">Vercel-first — managed realtime and queue so nothing long-lived needs babysitting.</text>

  <g font-family="'Geist', system-ui, sans-serif" font-size="13">
    <!-- Client -->
    <g transform="translate(72,200)">
      <rect width="240" height="140" rx="14" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="24" y="44" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24" fill="#161513">browser</text>
      <line x1="24" y1="58" x2="216" y2="58" stroke="#E6DFD2"/>
      <text x="24" y="84" fill="#161513">Next.js 15 · Tailwind</text>
      <text x="24" y="106" fill="#161513">shadcn/ui · PWA</text>
      <text x="24" y="128" fill="#FF4F1F">Ably JS (WebSocket)</text>
    </g>

    <!-- Vercel -->
    <g transform="translate(420,200)">
      <rect width="280" height="340" rx="14" fill="#FFFFFF" stroke="#161513" stroke-width="1.4"/>
      <text x="24" y="44" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="24" fill="#161513">vercel</text>
      <line x1="24" y1="58" x2="256" y2="58" stroke="#E6DFD2"/>
      <rect x="24" y="78" width="232" height="68" rx="10" fill="#F7F3EC" stroke="#E6DFD2"/>
      <text x="140" y="106" text-anchor="middle" font-weight="600" fill="#161513">Next.js (SSR / static)</text>
      <text x="140" y="126" text-anchor="middle" font-size="11" fill="#807972">UI · auth callbacks · pages</text>
      <rect x="24" y="158" width="232" height="68" rx="10" fill="#F7F3EC" stroke="#E6DFD2"/>
      <text x="140" y="186" text-anchor="middle" font-weight="600" fill="#161513">Django @ /api/*</text>
      <text x="140" y="206" text-anchor="middle" font-size="11" fill="#807972">@vercel/python serverless</text>
      <rect x="24" y="238" width="232" height="68" rx="10" fill="#F7F3EC" stroke="#E6DFD2"/>
      <text x="140" y="268" text-anchor="middle" font-size="12" fill="#FF4F1F">Vercel Cron</text>
      <text x="140" y="288" text-anchor="middle" font-size="11" fill="#807972">rotate · purge · moderation sweep</text>
    </g>

    <!-- Postgres -->
    <g transform="translate(808,200)">
      <rect width="260" height="100" rx="14" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="24" y="42" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#161513">neon postgres</text>
      <line x1="24" y1="56" x2="236" y2="56" stroke="#E6DFD2"/>
      <text x="24" y="78" fill="#161513">users · convos · tags</text>
      <text x="24" y="94" fill="#807972">messages — capped, rotating</text>
    </g>

    <!-- Redis -->
    <g transform="translate(808,320)">
      <rect width="260" height="100" rx="14" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="24" y="42" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#161513">upstash redis</text>
      <line x1="24" y1="56" x2="236" y2="56" stroke="#E6DFD2"/>
      <text x="24" y="78" fill="#161513">hot msgs · match queue</text>
      <text x="24" y="94" fill="#807972">rate-limits · persona memory</text>
    </g>

    <!-- Ably -->
    <g transform="translate(808,440)">
      <rect width="260" height="100" rx="14" fill="#FFFFFF" stroke="#FF4F1F" stroke-width="1.4"/>
      <text x="24" y="42" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#161513">ably realtime</text>
      <line x1="24" y1="56" x2="236" y2="56" stroke="#E6DFD2"/>
      <text x="24" y="78" fill="#161513">pub/sub per conversation</text>
      <text x="24" y="94" fill="#807972">typing indicators · presence</text>
    </g>

    <!-- Bot worker -->
    <g transform="translate(1180,200)">
      <rect width="180" height="220" rx="14" fill="#161513"/>
      <text x="24" y="40" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#F7F3EC">bot worker</text>
      <line x1="24" y1="54" x2="156" y2="54" stroke="#3A3733"/>
      <text x="24" y="78" fill="#F7F3EC" font-size="12">Vercel Cron + Fly.io</text>
      <rect x="24" y="98" width="132" height="44" rx="8" fill="#1F1D1A"/>
      <text x="90" y="125" text-anchor="middle" font-size="12" fill="#F7F3EC">Claude (sonnet/haiku)</text>
      <rect x="24" y="156" width="132" height="44" rx="8" fill="#1F1D1A"/>
      <text x="90" y="183" text-anchor="middle" font-size="12" fill="#F7F3EC">humanizer · pacing</text>
    </g>

    <!-- Moderation -->
    <g transform="translate(1180,440)">
      <rect width="180" height="120" rx="14" fill="#FFFFFF" stroke="#FF4F1F" stroke-width="1.4"/>
      <text x="24" y="40" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#161513">moderation</text>
      <line x1="24" y1="54" x2="156" y2="54" stroke="#E6DFD2"/>
      <text x="24" y="78" fill="#161513" font-size="12">in-flight scan</text>
      <text x="24" y="96" fill="#807972" font-size="12">Claude judge · OpenAI</text>
      <text x="24" y="114" fill="#FF4F1F" font-size="12">→ reports · bans</text>
    </g>

    <!-- Anti-spam -->
    <g transform="translate(72,620)">
      <rect width="620" height="220" rx="14" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="28" y="48" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="26" fill="#161513">defending the human pool</text>
      <line x1="28" y1="62" x2="592" y2="62" stroke="#E6DFD2"/>
      <text x="28" y="92" fill="#161513">— behavioral signals: typing speed · paste ratio · jitter · entropy</text>
      <text x="28" y="116" fill="#161513">— identity: OAuth required to enter the verified-human pool</text>
      <text x="28" y="140" fill="#161513">— trust score per account, decays on reports</text>
      <text x="28" y="164" fill="#161513">— rate limits in Redis sliding windows</text>
      <text x="28" y="188" fill="#161513">— device fingerprint (FingerprintJS open-source)</text>
      <text x="28" y="208" fill="#FF4F1F">→ shadow-ban · full-ban · ban-evasion catch</text>
    </g>

    <!-- Rotation -->
    <g transform="translate(720,620)">
      <rect width="640" height="220" rx="14" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="28" y="48" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="26" fill="#161513">limited db by design</text>
      <line x1="28" y1="62" x2="612" y2="62" stroke="#E6DFD2"/>
      <text x="28" y="92" fill="#161513">— Redis hot store: last 50 msgs/convo · TTL 24h after activity</text>
      <text x="28" y="116" fill="#161513">— Postgres warm store: last 20 msgs/convo, older pruned on insert</text>
      <text x="28" y="140" fill="#161513">— idle &gt; 7d → conversation fully purged</text>
      <text x="28" y="164" fill="#161513">— vault: up to 10 saved chats per user, still rotates</text>
      <text x="28" y="188" fill="#161513">— aggregates kept long-term, raw text isn't</text>
      <text x="28" y="208" fill="#FF4F1F">→ footprint stays flat regardless of MAU growth</text>
    </g>

    <!-- arrows -->
    <line x1="312" y1="270" x2="420" y2="290" stroke="#161513" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="700" y1="240" x2="808" y2="240" stroke="#161513" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="700" y1="350" x2="808" y2="360" stroke="#161513" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="700" y1="450" x2="808" y2="475" stroke="#FF4F1F" stroke-width="1.4" marker-end="url(#arrCoral)"/>
    <line x1="1068" y1="350" x2="1180" y2="305" stroke="#161513" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="1180" y1="380" x2="1068" y2="470" stroke="#FF4F1F" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrCoral)"/>
    <line x1="1180" y1="500" x2="1068" y2="510" stroke="#FF4F1F" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrCoral)"/>
  </g>
</svg>
