  <g font-family="Inter" font-size="12" font-weight="600">
    <g transform="translate(24,376)">
      <rect width="74" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="37" y="21" text-anchor="middle" fill="#a78bfa">#chill</text>
