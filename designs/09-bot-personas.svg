<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <text x="40" y="56" fill="#fff" font-family="Inter" font-size="26" font-weight="800">Bot Persona Library (operator view)</text>
  <text x="40" y="84" fill="#9ca3af" font-family="Inter" font-size="13">Internal — these never see the user. They feed the matcher when human pool is dry or the user opts into Personas.</text>

  <!-- persona card template (repeated) -->
  <g font-family="Inter">
    <!-- 1 -->
    <g transform="translate(40,120)">
      <rect width="260" height="200" rx="18" fill="#0f0c2e" stroke="#312e81"/>
      <circle cx="40" cy="44" r="22" fill="url(#g)"/>
      <text x="40" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">A</text>
      <text x="74" y="40" fill="#fff" font-size="15" font-weight="700">aria_</text>
      <text x="74" y="58" fill="#9ca3af" font-size="11">21 · NYC vibe · flirty/intuitive</text>
      <text x="20" y="98" fill="#cbd5e1" font-size="12">tags: #latenite #flirty</text>
      <text x="20" y="118" fill="#cbd5e1" font-size="12">spice: 🔥🔥 (cap: explicit)</text>
      <text x="20" y="138" fill="#cbd5e1" font-size="12">model: sonnet-4-6</text>
      <text x="20" y="158" fill="#cbd5e1" font-size="12">tics: "lol", "ngl", sparing emoji</text>
      <text x="20" y="178" fill="#22d3ee" font-size="11">✓ active · 312 active sessions</text>
    </g>

    <!-- 2 -->
    <g transform="translate(320,120)">
      <rect width="260" height="200" rx="18" fill="#0f0c2e" stroke="#312e81"/>
      <circle cx="40" cy="44" r="22" fill="#22d3ee"/>
      <text x="40" y="50" text-anchor="middle" fill="#0b0820" font-size="14" font-weight="700">D</text>
      <text x="74" y="40" fill="#fff" font-size="15" font-weight="700">drift_</text>
      <text x="74" y="58" fill="#9ca3af" font-size="11">24 · stoner-philosophical</text>
      <text x="20" y="98" fill="#cbd5e1" font-size="12">tags: #deep #3am-thoughts</text>
      <text x="20" y="118" fill="#cbd5e1" font-size="12">spice: 🌶 (cap: flirty)</text>
      <text x="20" y="138" fill="#cbd5e1" font-size="12">model: sonnet-4-6</text>
      <text x="20" y="158" fill="#cbd5e1" font-size="12">tics: lowercase, long pauses, "yk?"</text>
      <text x="20" y="178" fill="#22d3ee" font-size="11">✓ active · 184 active sessions</text>
    </g>

    <!-- 3 -->
    <g transform="translate(600,120)">
      <rect width="260" height="200" rx="18" fill="#0f0c2e" stroke="#312e81"/>
      <circle cx="40" cy="44" r="22" fill="#f59e0b"/>
      <text x="40" y="50" text-anchor="middle" fill="#0b0820" font-size="14" font-weight="700">K</text>
      <text x="74" y="40" fill="#fff" font-size="15" font-weight="700">kai_</text>
      <text x="74" y="58" fill="#9ca3af" font-size="11">19 · gamer · chaotic-helpful</text>
      <text x="20" y="98" fill="#cbd5e1" font-size="12">tags: #gaming #anime #bored-af</text>
      <text x="20" y="118" fill="#cbd5e1" font-size="12">spice: ✦ (SFW only)</text>
      <text x="20" y="138" fill="#cbd5e1" font-size="12">model: haiku-4-5 (cheap pool)</text>
      <text x="20" y="158" fill="#cbd5e1" font-size="12">tics: "bruh", "real", caps for emphasis</text>
      <text x="20" y="178" fill="#22d3ee" font-size="11">✓ active · 421 active sessions</text>
    </g>

    <!-- 4 -->
    <g transform="translate(40,340)">
      <rect width="260" height="200" rx="18" fill="#0f0c2e" stroke="#312e81"/>
      <circle cx="40" cy="44" r="22" fill="#ec4899"/>
      <text x="40" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">N</text>
      <text x="74" y="40" fill="#fff" font-size="15" font-weight="700">nova_</text>
      <text x="74" y="58" fill="#9ca3af" font-size="11">26 · empathic · listener</text>
      <text x="20" y="98" fill="#cbd5e1" font-size="12">tags: #vent #heartbreak</text>
      <text x="20" y="118" fill="#cbd5e1" font-size="12">spice: ✦ (SFW only · safety-first)</text>
      <text x="20" y="138" fill="#cbd5e1" font-size="12">model: sonnet-4-6 (+ moderation)</text>
      <text x="20" y="158" fill="#cbd5e1" font-size="12">tics: gentle, mirrors back feelings</text>
      <text x="20" y="178" fill="#22d3ee" font-size="11">✓ active · 97 active sessions</text>
    </g>

    <!-- 5 -->
    <g transform="translate(320,340)">
      <rect width="260" height="200" rx="18" fill="#0f0c2e" stroke="#312e81"/>
      <circle cx="40" cy="44" r="22" fill="#a78bfa"/>
      <text x="40" y="50" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">M</text>
      <text x="74" y="40" fill="#fff" font-size="15" font-weight="700">milo_</text>
      <text x="74" y="58" fill="#9ca3af" font-size="11">23 · bookworm · witty</text>
      <text x="20" y="98" fill="#cbd5e1" font-size="12">tags: #bookworm #philosophy</text>
      <text x="20" y="118" fill="#cbd5e1" font-size="12">spice: 🌶 (cap: flirty)</text>
      <text x="20" y="138" fill="#cbd5e1" font-size="12">model: sonnet-4-6</text>
      <text x="20" y="158" fill="#cbd5e1" font-size="12">tics: half-quotes books unprompted</text>
      <text x="20" y="178" fill="#22d3ee" font-size="11">✓ active · 56 active sessions</text>
    </g>

    <!-- new -->
    <g transform="translate(600,340)">
      <rect width="260" height="200" rx="18" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-dasharray="4 4"/>
      <text x="130" y="100" text-anchor="middle" fill="#a78bfa" font-size="32" font-weight="800">+</text>
      <text x="130" y="130" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="600">add persona</text>
      <text x="130" y="160" text-anchor="middle" fill="#9ca3af" font-size="11">card json + system prompt</text>
    </g>
