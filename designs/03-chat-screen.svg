<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F7F3EC"/>

  <!-- header -->
  <text x="24" y="44" font-family="'Geist', system-ui, sans-serif" font-size="22" fill="#161513">←</text>
  <text x="195" y="40" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="22" fill="#161513">aria_</text>
  <text x="195" y="60" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" fill="#807972"><tspan fill="#2C5F4F">●</tspan>  online · latenite · flirty</text>
  <text x="358" y="46" text-anchor="end" font-family="'Geist', system-ui, sans-serif" font-size="20" fill="#161513">⋯</text>
  <line x1="0" y1="84" x2="390" y2="84" stroke="#E6DFD2"/>

  <!-- date -->
  <text x="195" y="116" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" fill="#807972">Today, 1:42 AM</text>

  <!-- them 1 (rounded except bottom-left = "tail" toward sender side) -->
  <path d="M44,138 h210 a18,18 0 0 1 18,18 v8 a18,18 0 0 1 -18,18 h-204 a18,18 0 0 1 -18,-18 v-26 z"
        fill="#FFFFFF" stroke="#E6DFD2"/>
  <text x="44" y="170" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#161513">hey what're you doing up</text>

  <!-- them 2 -->
  <path d="M44,196 h160 a18,18 0 0 1 18,18 v8 a18,18 0 0 1 -18,18 h-154 a18,18 0 0 1 -18,-18 v-26 z"
        fill="#FFFFFF" stroke="#E6DFD2"/>
  <text x="44" y="228" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#161513">can't sleep either?</text>

  <!-- me (ink, bottom-right squared) -->
  <path d="M186,256 h160 a18,18 0 0 1 18,18 v26 h-178 a18,18 0 0 1 -18,-18 v-8 a18,18 0 0 1 18,-18 z"
        fill="#161513"/>
  <text x="346" y="288" text-anchor="end" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#F7F3EC">yeah brain won't shut up</text>

  <!-- them 3 (two lines) -->
  <path d="M44,316 h260 a18,18 0 0 1 18,18 v32 a18,18 0 0 1 -18,18 h-254 a18,18 0 0 1 -18,-18 v-50 z"
        fill="#FFFFFF" stroke="#E6DFD2"/>
  <text x="44" y="346" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#161513">same. tell me something stupid</text>
  <text x="44" y="368" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#161513">that's been on your mind</text>

  <!-- me 2 -->
  <path d="M166,396 h200 a18,18 0 0 1 18,18 v50 h-218 a18,18 0 0 1 -18,-18 v-32 a18,18 0 0 1 18,-18 z"
        fill="#161513"/>
  <text x="346" y="426" text-anchor="end" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#F7F3EC">do you ever feel like</text>
  <text x="346" y="448" text-anchor="end" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#F7F3EC">strangers know us better</text>

  <!-- them typing -->
  <path d="M44,484 h44 a18,18 0 0 1 18,18 v4 a18,18 0 0 1 -18,18 h-38 a18,18 0 0 1 -18,-18 v-22 z"
        fill="#FFFFFF" stroke="#E6DFD2"/>
  <circle cx="46" cy="506" r="3.5" fill="#161513"/>
  <circle cx="62" cy="506" r="3.5" fill="#161513" opacity="0.5"/>
  <circle cx="78" cy="506" r="3.5" fill="#161513" opacity="0.25"/>

  <!-- ephemeral notice -->
  <text x="195" y="580" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" fill="#807972">— messages older than 7 days disappear —</text>

  <!-- input -->
  <line x1="0" y1="756" x2="390" y2="756" stroke="#E6DFD2"/>
  <rect x="24" y="772" width="270" height="48" rx="24" fill="#FFFFFF" stroke="#E6DFD2"/>
  <text x="48" y="802" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#807972">whisper something...</text>
  <circle cx="334" cy="796" r="24" fill="#FF4F1F"/>
  <text x="334" y="803" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="18" fill="#FFFFFF">↑</text>
</svg>
