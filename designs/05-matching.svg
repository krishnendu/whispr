<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F7F3EC"/>

  <!-- header -->
  <text x="24" y="48" font-family="'Geist', system-ui, sans-serif" font-size="22" fill="#161513">✕</text>
  <text x="195" y="46" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="13" letter-spacing="2" fill="#807972">FINDING SOMEONE</text>

  <!-- concentric rings (minimal, single color) -->
  <g transform="translate(195,370)" fill="none" stroke="#FF4F1F">
    <circle r="180" stroke-width="1" opacity="0.10"/>
    <circle r="140" stroke-width="1" opacity="0.18"/>
    <circle r="100" stroke-width="1" opacity="0.30"/>
    <circle r="60"  stroke-width="1.5" opacity="0.55"/>
  </g>
  <circle cx="195" cy="370" r="28" fill="#FF4F1F"/>
  <circle cx="195" cy="370" r="6" fill="#F7F3EC"/>

  <!-- text -->
  <text x="195" y="606" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="36" fill="#161513">listening for whispers...</text>
  <text x="195" y="638" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#807972">matching by your vibes</text>

  <!-- tags shown -->
  <g font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="500">
    <g transform="translate(75,660)">
      <rect width="64" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="32" y="20" text-anchor="middle" fill="#161513">chill</text>
    </g>
    <g transform="translate(149,660)">
      <rect width="84" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="42" y="20" text-anchor="middle" fill="#161513">latenite</text>
    </g>
    <g transform="translate(243,660)">
      <rect width="72" height="32" rx="16" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="36" y="20" text-anchor="middle" fill="#161513">flirty</text>
    </g>
  </g>

  <text x="195" y="730" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="12" fill="#807972">avg wait — 4 seconds</text>

  <!-- cancel as ghost button -->
  <text x="195" y="788" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="600" fill="#161513">cancel</text>
  <line x1="174" y1="796" x2="216" y2="796" stroke="#161513" stroke-width="1"/>
</svg>
