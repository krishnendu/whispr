<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#F7F3EC"/>

  <text x="72" y="100" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="56" fill="#161513">the system</text>
  <text x="72" y="134" font-family="'Geist', system-ui, sans-serif" font-size="14" fill="#807972">Warm paper. Deep ink. One bold coral. No gradients. Room to breathe.</text>

  <!-- swatches -->
  <g font-family="'Geist', system-ui, sans-serif">
    <g transform="translate(72,200)">
      <rect width="180" height="180" rx="16" fill="#F7F3EC" stroke="#E6DFD2"/>
      <text x="0" y="216" font-size="14" font-weight="600" fill="#161513">paper</text>
      <text x="0" y="240" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#807972">#F7F3EC</text>
    </g>
    <g transform="translate(280,200)">
      <rect width="180" height="180" rx="16" fill="#FFFFFF" stroke="#E6DFD2"/>
      <text x="0" y="216" font-size="14" font-weight="600" fill="#161513">card</text>
      <text x="0" y="240" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#807972">#FFFFFF</text>
    </g>
    <g transform="translate(488,200)">
      <rect width="180" height="180" rx="16" fill="#161513"/>
      <text x="0" y="216" font-size="14" font-weight="600" fill="#161513">ink</text>
      <text x="0" y="240" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#807972">#161513</text>
    </g>
    <g transform="translate(696,200)">
      <rect width="180" height="180" rx="16" fill="#FF4F1F"/>
      <text x="0" y="216" font-size="14" font-weight="600" fill="#161513">coral · action</text>
      <text x="0" y="240" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#807972">#FF4F1F</text>
    </g>
    <g transform="translate(904,200)">
      <rect width="180" height="180" rx="16" fill="#2C5F4F"/>
      <text x="0" y="216" font-size="14" font-weight="600" fill="#161513">moss · verified</text>
      <text x="0" y="240" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" fill="#807972">#2C5F4F</text>
    </g>
  </g>

  <line x1="72" y1="448" x2="1128" y2="448" stroke="#E6DFD2"/>

  <!-- typography -->
  <g font-family="'Geist', system-ui, sans-serif" fill="#161513">
    <text x="72" y="498" font-size="12" letter-spacing="2" fill="#807972">TYPOGRAPHY</text>

    <text x="72" y="558" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="52">Instrument Serif — italic</text>
    <text x="72" y="582" font-size="13" fill="#807972">display · headers · intimate copy</text>

    <text x="72" y="630" font-size="28" font-weight="600">Geist — regular · medium · semibold</text>
    <text x="72" y="656" font-size="13" fill="#807972">body · UI · buttons</text>

    <text x="710" y="630" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" font-weight="500">Geist Mono</text>
    <text x="710" y="656" font-size="13" fill="#807972">handles · tags · codes</text>
  </g>
</svg>
