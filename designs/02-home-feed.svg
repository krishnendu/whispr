  <text x="338" y="552" text-anchor="end" fill="#a78bfa" font-family="Inter" font-size="12">see all</text>

  <g transform="translate(24,572)">
    <rect width="342" height="72" rx="16" fill="#0f0c2e" stroke="#312e81"/>
    <circle cx="40" cy="36" r="20" fill="url(#accent)"/>
    <text x="40" y="42" text-anchor="middle" fill="#fff" font-family="Inter" font-size="14" font-weight="700">A</text>
    <text x="74" y="32" fill="#fff" font-family="Inter" font-size="14" font-weight="600">aria_</text>
