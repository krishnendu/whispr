<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#F7F3EC"/>

  <!-- status bar -->
  <text x="32" y="38" fill="#161513" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="600">9:41</text>

  <!-- wordmark -->
  <text x="32" y="98" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="40" fill="#161513">whispr</text>
  <circle cx="138" cy="92" r="5" fill="#FF4F1F"/>

  <!-- intro -->
  <text x="32" y="178" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="44" fill="#161513">say hi.</text>
  <text x="32" y="218" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="38" fill="#161513">nobody has to know</text>
  <text x="32" y="252" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="38" fill="#161513">it's you.</text>

  <!-- handle -->
  <text x="32" y="320" font-family="'Geist', system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#807972">YOUR HANDLE</text>
  <text x="32" y="362" font-family="'Geist Mono', ui-monospace, monospace" font-size="24" font-weight="500" fill="#161513">@moonlit_fox</text>
  <line x1="32" y1="376" x2="358" y2="376" stroke="#161513" stroke-width="1.5"/>

  <!-- vibes -->
  <text x="32" y="420" font-family="'Geist', system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#807972">PICK 3 — 5 VIBES</text>

  <g font-family="'Geist', system-ui, sans-serif" font-size="14">
    <g transform="translate(32,436)">
      <rect width="74" height="36" rx="18" fill="#161513"/>
      <text x="37" y="23" text-anchor="middle" fill="#F7F3EC">chill</text>
    </g>
    <g transform="translate(114,436)">
      <rect width="90" height="36" rx="18" fill="#161513"/>
      <text x="45" y="23" text-anchor="middle" fill="#F7F3EC">latenite</text>
    </g>
    <g transform="translate(212,436)">
      <rect width="74" height="36" rx="18" fill="#161513"/>
      <text x="37" y="23" text-anchor="middle" fill="#F7F3EC">flirty</text>
    </g>
    <g transform="translate(32,480)">
      <rect width="72" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="36" y="23" text-anchor="middle" fill="#161513">vent</text>
    </g>
    <g transform="translate(112,480)">
      <rect width="92" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="46" y="23" text-anchor="middle" fill="#161513">gaming</text>
    </g>
    <g transform="translate(212,480)">
      <rect width="72" height="36" rx="18" fill="none" stroke="#161513" stroke-width="1.2"/>
      <text x="36" y="23" text-anchor="middle" fill="#161513">deep</text>
    </g>
    <g transform="translate(292,480)">
      <rect width="66" height="36" rx="18" fill="none" stroke="#807972" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="33" y="23" text-anchor="middle" fill="#807972">+ more</text>
    </g>
  </g>

  <!-- age -->
  <line x1="32" y1="560" x2="358" y2="560" stroke="#E6DFD2"/>
  <g transform="translate(32,584)">
    <rect width="22" height="22" rx="6" fill="#161513"/>
    <path d="M5 12 l5 5 l11 -12" fill="none" stroke="#F7F3EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="17" font-family="'Geist', system-ui, sans-serif" font-size="15" font-weight="500" fill="#161513">I'm 18+</text>
    <text x="36" y="36" font-family="'Geist', system-ui, sans-serif" font-size="12" fill="#807972">unlocks spicier conversations</text>
  </g>

  <!-- cta -->
  <rect x="32" y="688" width="326" height="60" rx="30" fill="#FF4F1F"/>
  <text x="195" y="726" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">start whispering</text>

  <text x="195" y="788" text-anchor="middle" font-family="'Geist', system-ui, sans-serif" font-size="11" fill="#807972">by continuing you agree to our terms &amp; privacy.</text>
</svg>
