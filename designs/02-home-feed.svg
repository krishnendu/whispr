    <circle cx="40" cy="36" r="20" fill="#22d3ee"/>
    <text x="40" y="42" text-anchor="middle" fill="#0b0820" font-family="Inter" font-size="14" font-weight="700">D</text>
    <text x="74" y="32" fill="#fff" font-family="Inter" font-size="14" font-weight="600">drift_</text>
    <text x="74" y="52" fill="#9ca3af" font-family="Inter" font-size="12">"see you in the void"</text>
    <text x="320" y="32" text-anchor="end" fill="#6b7280" font-family="Inter" font-size="11">5d</text>
  </g>

  <!-- bottom nav -->
