<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- status bar -->
  <text x="24" y="34" fill="#fff" font-family="Inter" font-size="14" font-weight="600">9:41</text>

  <!-- logo -->
  <text x="195" y="120" text-anchor="middle" fill="url(#accent)" font-family="Inter" font-size="40" font-weight="800">Whispr</text>
  <text x="195" y="148" text-anchor="middle" fill="#cbd5e1" font-family="Inter" font-size="13" letter-spacing="3">TALK · TO · ANYONE</text>

  <!-- card -->
  <rect x="24" y="200" width="342" height="540" rx="28" fill="#0f0c2e" stroke="#312e81" stroke-width="1"/>

  <text x="48" y="248" fill="#fff" font-family="Inter" font-size="22" font-weight="700">Pick a handle</text>
  <text x="48" y="272" fill="#9ca3af" font-family="Inter" font-size="13">No real name. Anything goes (almost).</text>
  <rect x="48" y="294" width="294" height="52" rx="12" fill="#1a1740" stroke="#4c1d95"/>
  <text x="68" y="326" fill="#a78bfa" font-family="Inter" font-size="16">@moonlit_fox</text>

  <text x="48" y="380" fill="#fff" font-family="Inter" font-size="18" font-weight="700">Your vibe (pick 3-5)</text>

  <!-- tag pills -->
  <g font-family="Inter" font-size="12" font-weight="600">
    <g transform="translate(48,400)">
      <rect width="74" height="32" rx="16" fill="url(#accent)"/>
      <text x="37" y="21" text-anchor="middle" fill="#fff">#chill</text>
    </g>
    <g transform="translate(130,400)">
      <rect width="84" height="32" rx="16" fill="url(#accent)"/>
      <text x="42" y="21" text-anchor="middle" fill="#fff">#latenite</text>
    </g>
    <g transform="translate(222,400)">
      <rect width="88" height="32" rx="16" fill="url(#accent)"/>
      <text x="44" y="21" text-anchor="middle" fill="#fff">#flirty</text>
    </g>
    <g transform="translate(48,444)">
      <rect width="100" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="50" y="21" text-anchor="middle" fill="#cbd5e1">#vent</text>
    </g>
    <g transform="translate(156,444)">
      <rect width="110" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="55" y="21" text-anchor="middle" fill="#cbd5e1">#gaming</text>
    </g>
    <g transform="translate(274,444)">
      <rect width="68" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="34" y="21" text-anchor="middle" fill="#cbd5e1">#deep</text>
    </g>
    <g transform="translate(48,488)">
      <rect width="120" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="60" y="21" text-anchor="middle" fill="#cbd5e1">#philosophy</text>
    </g>
    <g transform="translate(176,488)">
      <rect width="100" height="32" rx="16" fill="#1a1740" stroke="#4c1d95"/>
      <text x="50" y="21" text-anchor="middle" fill="#cbd5e1">#music</text>
    </g>
  </g>

  <!-- age confirm -->
  <rect x="48" y="554" width="294" height="64" rx="14" fill="#1a1740" stroke="#4c1d95"/>
  <circle cx="72" cy="586" r="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="92" y="582" fill="#fff" font-family="Inter" font-size="14" font-weight="600">I'm 18+</text>
  <text x="92" y="600" fill="#9ca3af" font-family="Inter" font-size="11">Unlock spicier conversations</text>

  <!-- continue -->
  <rect x="48" y="650" width="294" height="56" rx="28" fill="url(#accent)"/>
  <text x="195" y="685" text-anchor="middle" fill="#fff" font-family="Inter" font-size="17" font-weight="700">Enter the void →</text>

  <text x="195" y="780" text-anchor="middle" fill="#6b7280" font-family="Inter" font-size="11">By continuing you agree to our Terms & Privacy.</text>
</svg>
