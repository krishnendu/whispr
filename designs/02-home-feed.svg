  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <!-- top bar -->
  <text x="24" y="60" fill="url(#accent)" font-family="Inter" font-size="26" font-weight="800">Whispr</text>
  <circle cx="358" cy="55" r="18" fill="#1a1740" stroke="#4c1d95"/>
  <text x="358" y="61" text-anchor="middle" fill="#a78bfa" font-family="Inter" font-size="14" font-weight="700">M</text>

  <!-- greeting -->
