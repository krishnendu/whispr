<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <radialGradient id="pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b0820" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>

  <text x="24" y="60" fill="#a78bfa" font-family="Inter" font-size="22">✕</text>
  <text x="195" y="60" text-anchor="middle" fill="#fff" font-family="Inter" font-size="16" font-weight="700">Listening for whispers...</text>

  <!-- pulse rings -->
  <g transform="translate(195,360)">
    <circle r="160" fill="url(#pulse)"/>
    <circle r="120" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.5"/>
    <circle r="80" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.7"/>
    <circle r="44" fill="url(#accent)"/>
    <text y="6" text-anchor="middle" fill="#fff" font-family="Inter" font-size="20" font-weight="800">whispr</text>
  </g>

  <!-- floating bubbles representing other users -->
  <g font-family="Inter" font-size="11" font-weight="600">
    <circle cx="80" cy="220" r="20" fill="#1a1740" stroke="#4c1d95"/>
    <text x="80" y="225" text-anchor="middle" fill="#a78bfa">@k_</text>
    <circle cx="320" cy="240" r="24" fill="#1a1740" stroke="#4c1d95"/>
    <text x="320" y="245" text-anchor="middle" fill="#a78bfa">@nyx</text>
    <circle cx="60" cy="430" r="22" fill="#1a1740" stroke="#4c1d95"/>
    <text x="60" y="435" text-anchor="middle" fill="#a78bfa">@mio</text>
    <circle cx="330" cy="460" r="18" fill="#1a1740" stroke="#4c1d95"/>
    <text x="330" y="465" text-anchor="middle" fill="#a78bfa">@?</text>
    <circle cx="150" cy="580" r="20" fill="#1a1740" stroke="#4c1d95"/>
    <text x="150" y="585" text-anchor="middle" fill="#a78bfa">@v</text>
    <circle cx="270" cy="600" r="22" fill="#1a1740" stroke="#4c1d95"/>
    <text x="270" y="605" text-anchor="middle" fill="#a78bfa">@ari</text>
  </g>

  <!-- status -->
  <text x="195" y="640" text-anchor="middle" fill="#fff" font-family="Inter" font-size="18" font-weight="700">Matching by your vibes...</text>
  <text x="195" y="664" text-anchor="middle" fill="#9ca3af" font-family="Inter" font-size="13">#latenite · #chill · #flirty</text>
  <text x="195" y="700" text-anchor="middle" fill="#a78bfa" font-family="Inter" font-size="12">avg wait: 4 seconds</text>

  <!-- cancel -->
  <rect x="115" y="744" width="160" height="48" rx="24" fill="none" stroke="#4c1d95"/>
  <text x="195" y="774" text-anchor="middle" fill="#cbd5e1" font-family="Inter" font-size="14" font-weight="600">Cancel</text>
</svg>
