  <g font-family="Inter" font-size="11" font-weight="600">
    <text x="50" y="810" text-anchor="middle" fill="#a78bfa">●</text>
    <text x="50" y="828" text-anchor="middle" fill="#a78bfa">Home</text>
    <text x="145" y="810" text-anchor="middle" fill="#6b7280">○</text>
    <text x="145" y="828" text-anchor="middle" fill="#6b7280">Discover</text>
    <text x="245" y="810" text-anchor="middle" fill="#6b7280">○</text>
    <text x="245" y="828" text-anchor="middle" fill="#6b7280">Chats</text>
    <text x="340" y="810" text-anchor="middle" fill="#6b7280">○</text>
